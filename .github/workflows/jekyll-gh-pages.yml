name: Deploy sample-pwa to GitHub Pages

on:
  push:
    branches: ["main", "master"]
    paths:
      - "sample-pwa/**"
      - "aznavrail-react/**"
      - ".github/workflows/jekyll-gh-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; do not cancel in-progress runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # sample-pwa consumes aznavrail-react's built `lib/`, which is gitignored — so it has to be
      # built here, and the build has to be allowed to fail the job. It used to run as
      # `bob build || true` with a force-emit tsc fallback; that masked a genuine build break and
      # left a stale `lib/` in place, which then failed the PWA build with unresolved imports.
      - name: Install aznavrail-react deps
        working-directory: aznavrail-react
        run: npm ci --no-audit --no-fund

      - name: Build aznavrail-react
        working-directory: aznavrail-react
        run: npm run build

      - name: Install sample-pwa deps
        working-directory: sample-pwa
        run: npm ci --no-audit --no-fund

      - name: Build sample-pwa
        working-directory: sample-pwa
        env:
          # GitHub Pages serves the project under /<repo-name>/.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sample-pwa/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
