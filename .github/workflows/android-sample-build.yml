name: Android Sample Build

on:
  push:
    paths-ignore:
      - 'more-from-az.json'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'more-from-az.json'
      - '**/*.md'

jobs:
  ux-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@v4

    - name: Test UX analyzer
      run: python .github/scripts/test_compose_destinations_ux.py

    - name: Generate UX code-scanning report
      run: >-
        python .github/scripts/compose_destinations_ux.py SampleApp/src/main --root .
        --format sarif --output build/reports/compose-destinations-ux.sarif --fail-on none

    - name: Add UX annotations and job summary
      run: >-
        python .github/scripts/compose_destinations_ux.py SampleApp/src/main --root .
        --format github --summary "$GITHUB_STEP_SUMMARY" --fail-on none

    - name: Upload UX report to code scanning
      if: >-
        always() &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: build/reports/compose-destinations-ux.sarif
        category: compose-destinations-ux

    - name: Upload UX report artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: compose-destinations-ux-report
        path: build/reports/compose-destinations-ux.sarif

    - name: Enforce UX errors
      run: >-
        python .github/scripts/compose_destinations_ux.py SampleApp/src/main --root .
        --fail-on error --require-destinations

  build:
    needs: ux-analysis
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build SampleApp Debug
      run: ./gradlew :SampleApp:assembleDebug

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sample-app-debug
        path: SampleApp/build/outputs/apk/debug/*.apk

  # Compile the Compose Multiplatform sibling module across the target families a Linux runner can
  # build. iOS targets are intentionally omitted — Kotlin/Native cannot produce Apple binaries on
  # Linux (they require a macOS runner); they still *configure* fine here, they just aren't compiled.
  cmp-compile:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Compile commonMain (metadata)
      run: ./gradlew :aznavrail-cmp:compileCommonMainKotlinMetadata

    - name: Compile Android target
      run: ./gradlew :aznavrail-cmp:compileDebugKotlinAndroid

    - name: Compile Desktop (JVM) target
      run: ./gradlew :aznavrail-cmp:desktopMainClasses

    - name: Compile wasmJs target
      run: ./gradlew :aznavrail-cmp:compileKotlinWasmJs

    # Type-check the runnable demo against the published library API (Desktop + Web). Running the
    # demo (window / dev server) stays manual — see aznavrail-cmp-demo/README.md.
    - name: Compile demo (Desktop)
      run: ./gradlew :aznavrail-cmp-demo:desktopMainClasses

    - name: Compile demo (wasmJs)
      run: ./gradlew :aznavrail-cmp-demo:compileKotlinWasmJs
