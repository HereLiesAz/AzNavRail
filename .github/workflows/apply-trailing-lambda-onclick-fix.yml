name: Apply trailing-lambda onClick fix

on:
  push:
    branches: [ fix/trailing-lambda-onclick ]
    paths:
      - .github/workflows/apply-trailing-lambda-onclick-fix.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make onClick trailing and migrate hidden-menu call sites
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          api_roots = [
              Path('aznavrail/src/main/java/com/hereliesaz/aznavrail'),
              Path('aznavrail-cmp/src/commonMain/kotlin/com/hereliesaz/aznavrail'),
          ]

          def skip_quoted(s, i):
              if s.startswith('"""', i):
                  j = s.find('"""', i + 3)
                  return len(s) if j < 0 else j + 3
              q = s[i]
              i += 1
              while i < len(s):
                  if s[i] == '\\':
                      i += 2
                      continue
                  if s[i] == q:
                      return i + 1
                  i += 1
              return i

          def match_pair(s, start, opener, closer):
              depth = 0
              i = start
              while i < len(s):
                  if s.startswith('//', i):
                      j = s.find('\n', i + 2)
                      i = len(s) if j < 0 else j + 1
                      continue
                  if s.startswith('/*', i):
                      j = s.find('*/', i + 2)
                      i = len(s) if j < 0 else j + 2
                      continue
                  if s[i] in ('"', "'"):
                      i = skip_quoted(s, i)
                      continue
                  if s[i] == opener:
                      depth += 1
                  elif s[i] == closer:
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              raise RuntimeError(f'unmatched {opener} at {start}')

          def split_params(raw):
              parts = []
              start = 0
              par = ang = brack = brace = 0
              i = 0
              while i < len(raw):
                  if raw.startswith('//', i):
                      j = raw.find('\n', i + 2)
                      i = len(raw) if j < 0 else j + 1
                      continue
                  if raw.startswith('/*', i):
                      j = raw.find('*/', i + 2)
                      i = len(raw) if j < 0 else j + 2
                      continue
                  if raw[i] in ('"', "'"):
                      i = skip_quoted(raw, i)
                      continue
                  c = raw[i]
                  if c == '(': par += 1
                  elif c == ')': par -= 1
                  elif c == '<': ang += 1
                  elif c == '>': ang = max(0, ang - 1)
                  elif c == '[': brack += 1
                  elif c == ']': brack -= 1
                  elif c == '{': brace += 1
                  elif c == '}': brace -= 1
                  elif c == ',' and par == ang == brack == brace == 0:
                      parts.append(raw[start:i])
                      start = i + 1
                  i += 1
              parts.append(raw[start:])
              return parts

          changed_names = set()
          declaration_count = 0
          for root in api_roots:
              for path in root.rglob('*.kt'):
                  text = path.read_text(encoding='utf-8')
                  changes = []
                  for m in re.finditer(r'\bfun\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(', text):
                      name = m.group(1)
                      open_idx = text.find('(', m.start())
                      close_idx = match_pair(text, open_idx, '(', ')')
                      raw = text[open_idx + 1:close_idx]
                      params = split_params(raw)
                      names = []
                      for p in params:
                          mm = re.match(r'\s*(?:crossinline\s+|noinline\s+|vararg\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*:', p, re.S)
                          names.append(mm.group(1) if mm else None)
                      if not names or names[-1] != 'hiddenMenu' or 'onClick' not in names:
                          continue
                      click_index = names.index('onClick')
                      click = params.pop(click_index)
                      params.append(click)
                      if '\n' in raw:
                          new = '\n' + ',\n'.join('        ' + p.strip() for p in params) + '\n    '
                      else:
                          new = ', '.join(p.strip() for p in params)
                      changes.append((open_idx + 1, close_idx, new))
                      changed_names.add(name)
                  if changes:
                      for a, b, new in reversed(changes):
                          text = text[:a] + new + text[b:]
                      path.write_text(text, encoding='utf-8')
                      declaration_count += len(changes)

          if declaration_count < 10:
              raise SystemExit(f'Expected at least 10 API declarations/overrides, found {declaration_count}')

          # Existing consumers that intentionally built a hidden menu with a trailing lambda must
          # name that lambda explicitly now. We can identify them safely because HiddenMenuScope has
          # only listItem/inputItem builders; ordinary click callbacks cannot resolve those names.
          hidden_builder = re.compile(r'\b(?:listItem|inputItem)\s*\(')
          migrated = 0
          for path in Path('.').rglob('*.kt'):
              if any(part in {'.gradle', 'build'} for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              edits = []
              for name in sorted(changed_names, key=len, reverse=True):
                  for m in re.finditer(r'\b' + re.escape(name) + r'\s*\(', text):
                      prefix = text[max(0, m.start() - 12):m.start()]
                      if re.search(r'\bfun\s*$', prefix):
                          continue
                      open_idx = text.find('(', m.start())
                      try:
                          close_idx = match_pair(text, open_idx, '(', ')')
                      except RuntimeError:
                          continue
                      k = close_idx + 1
                      while k < len(text) and text[k].isspace():
                          k += 1
                      if k >= len(text) or text[k] != '{':
                          continue
                      end = match_pair(text, k, '{', '}')
                      body = text[k + 1:end]
                      args = text[open_idx + 1:close_idx]
                      if 'hiddenMenu' in args or not hidden_builder.search(body):
                          continue
                      comma = '' if not args.strip() or args.rstrip().endswith(',') else ','
                      insertion = comma + ' hiddenMenu = ' + text[k:end + 1]
                      replacement = text[m.start():close_idx] + insertion + ')'
                      edits.append((m.start(), end + 1, replacement))
              if edits:
                  # Discard overlapping edits (can occur when a nested hidden-menu call is seen while
                  # scanning a containing call); keep the smallest/innermost unique spans first.
                  unique = []
                  for edit in sorted(set(edits), key=lambda e: (e[0], e[1] - e[0])):
                      if any(not (edit[1] <= u[0] or edit[0] >= u[1]) for u in unique):
                          continue
                      unique.append(edit)
                  for a, b, new in sorted(unique, reverse=True):
                      text = text[:a] + new + text[b:]
                  path.write_text(text, encoding='utf-8')
                  migrated += len(unique)

          print(f'Reordered {declaration_count} declarations across {len(changed_names)} API names')
          print(f'Migrated {migrated} intentional hidden-menu trailing lambdas to hiddenMenu = {{...}}')
          if migrated < 5:
              raise SystemExit(f'Expected multiple existing hidden-menu consumers to migrate, found {migrated}')
          PY

      - name: Add regression tests
        run: |
          cat > aznavrail/src/test/java/com/hereliesaz/aznavrail/AzTrailingLambdaSemanticsTest.kt <<'EOF'
          package com.hereliesaz.aznavrail

          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertNotNull
          import org.junit.Test

          class AzTrailingLambdaSemanticsTest {
              @Test
              fun `rail subitem trailing lambda is deferred click callback`() {
                  val scope = AzNavRailScopeImpl()
                  scope.azRailHostItem(id = "host", text = "Host")
                  var calls = 0

                  scope.azRailSubItem(id = "child", hostId = "host", text = "Child") {
                      calls++
                  }

                  assertEquals("registration must not execute the trailing lambda", 0, calls)
                  assertNotNull(scope.onClickMap["child"])
                  scope.onClickMap["child"]?.invoke()
                  assertEquals(1, calls)
              }

              @Test
              fun `hidden menu remains explicit and separate from click`() {
                  val scope = AzNavRailScopeImpl()
                  scope.azRailHostItem(id = "host", text = "Host")
                  var clicks = 0
                  var hiddenActions = 0

                  scope.azRailSubItem(
                      id = "child",
                      hostId = "host",
                      text = "Child",
                      hiddenMenu = { listItem("Hidden") { hiddenActions++ } },
                  ) { clicks++ }

                  assertEquals(0, clicks)
                  assertEquals(0, hiddenActions)
                  scope.onClickMap["child"]?.invoke()
                  assertEquals(1, clicks)
                  assertEquals(0, hiddenActions)
              }
          }
          EOF

          mkdir -p aznavrail-cmp/src/commonTest/kotlin/com/hereliesaz/aznavrail
          cat > aznavrail-cmp/src/commonTest/kotlin/com/hereliesaz/aznavrail/AzTrailingLambdaSemanticsTest.kt <<'EOF'
          package com.hereliesaz.aznavrail

          import kotlin.test.Test
          import kotlin.test.assertEquals
          import kotlin.test.assertNotNull

          class AzTrailingLambdaSemanticsTest {
              @Test
              fun trailingLambdaIsDeferredClickCallback() {
                  val scope = AzNavRailScopeImpl()
                  scope.azRailHostItem(id = "host", text = "Host")
                  var calls = 0
                  scope.azRailSubItem(id = "child", hostId = "host", text = "Child") { calls++ }
                  assertEquals(0, calls)
                  assertNotNull(scope.onClickMap["child"])
                  scope.onClickMap["child"]?.invoke()
                  assertEquals(1, calls)
              }
          }
          EOF

      - name: Compile and test Android plus CMP
        run: |
          chmod +x gradlew
          ./gradlew :aznavrail:testDebugUnitTest :aznavrail-cmp:desktopTest :SampleApp:compileDebugKotlin :aznavrail-cmp-demo:compileKotlinDesktop

      - name: Commit verified API fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-trailing-lambda-onclick-fix.yml
          git add -A
          git commit -m "fix: make rail trailing lambdas click callbacks [skip ci]"
          git push origin HEAD:fix/trailing-lambda-onclick
