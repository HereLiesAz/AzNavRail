name: Release AzNavRail 11.27

on:
  push:
    branches:
      - chatgpt/release-11-27
    paths:
      - .github/workflows/chatgpt-release-11-27.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/release-11-27
          fetch-depth: 0

      - name: Create 11.27 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create 11.27 \
            --repo "$GITHUB_REPOSITORY" \
            --target d116cfa93971d58afab86f1bcb6ed6d62e65b0dd \
            --title "11.27" \
            --notes $'## What changed\n\n- Enable long-press drag-to-reorder for `azRailRelocItem` under `azUnattachedHostItem`.\n- Preserve quick taps and long-press hidden menus.\n- On FLOATING hosts, movement before the long-press threshold still drags the host; movement after it reorders the child.\n- Keep Android and Compose Multiplatform behavior in parity, with regression coverage.'

      - name: Remove one-shot release workflow
        run: |
          git rm .github/workflows/chatgpt-release-11-27.yml
          git config user.name ChatGPT
          git config user.email 103241502+HereLiesAz@users.noreply.github.com
          git commit -m "Remove one-shot 11.27 release workflow [skip ci]"
          git push origin HEAD:chatgpt/release-11-27
