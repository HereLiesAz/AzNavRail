name: Apply navigation readiness hardening

on:
  push:
    branches:
      - fix/navigation-readiness-20260911
    paths:
      - .github/workflows/apply-navigation-readiness-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply patch
        run: python .github/scripts/apply_navigation_readiness_fix.py

      - name: Compile Android and Compose Multiplatform navigation code
        run: |
          chmod +x gradlew
          ./gradlew :aznavrail:compileDebugKotlin :aznavrail-cmp:compileKotlinDesktop

      - name: Commit verified patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-navigation-readiness-fix.yml
          rm .github/scripts/apply_navigation_readiness_fix.py
          git add -A
          git commit -m "fix: defer rail navigation until graph is ready [skip ci]"
          git push origin HEAD:fix/navigation-readiness-20260911
