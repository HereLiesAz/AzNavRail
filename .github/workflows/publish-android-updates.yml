name: Publish Android update libraries

on:
  push:
    branches: [main]
    paths:
      - 'aznavrail-updates/**'
      - 'aznavrail-updates-play/**'
      - 'aznavrail-reviews-play/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/publish-android-updates.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-update-maven
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - id: versions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)*$ ]] || { echo 'versions=[]' >> "$GITHUB_OUTPUT"; exit 0; }
            versions=$(jq -cn --arg v "$RELEASE_TAG" '[$v]')
          else
            versions=$(jq -cn --arg v "$GITHUB_SHA" '[$v]')
            # Backfill the latest stable tag when publishing main; preserve SHA coordinates.
            tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null || true)
            if [[ "$tag" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)*$ ]]; then
              versions=$(jq -c --arg v "$tag" '. + [$v]' <<< "$versions")
            fi
          fi
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
  publish:
    needs: resolve
    if: needs.resolve.outputs.versions != '[]'
    strategy:
      max-parallel: 1
      matrix:
        version: ${{ fromJSON(needs.resolve.outputs.versions) }}
    env:
      UPDATE_VERSION: ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.version }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and publish the standalone artifacts
        env:
          JITPACK: 'true'
          JITPACK_VERSION: ${{ matrix.version }}
        run: |
          chmod +x gradlew
          ./gradlew :aznavrail-updates:testDebugUnitTest :aznavrail-updates:publishReleasePublicationToMavenLocal :aznavrail-updates-play:publishReleasePublicationToMavenLocal -Dmaven.repo.local="$RUNNER_TEMP/update-maven" --no-daemon
      - name: Publish immutable Maven coordinates
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/update-maven/com/github/HereLiesAz/AzNavRail"
          publish_dir="$RUNNER_TEMP/update-maven-branch"
          for module in aznavrail-updates aznavrail-updates-play; do
            test -s "$source_dir/$module/$UPDATE_VERSION/$module-$UPDATE_VERSION.aar"
            test -s "$source_dir/$module/$UPDATE_VERSION/$module-$UPDATE_VERSION.pom"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin refs/heads/update-maven; then
            git fetch origin refs/heads/update-maven
            git worktree add --detach "$publish_dir" FETCH_HEAD
          else
            status=$?
            test "$status" = 2
            git worktree add --detach "$publish_dir" HEAD
            git -C "$publish_dir" checkout --orphan update-maven-bootstrap
            git -C "$publish_dir" rm -rf .
          fi
          for module in aznavrail-updates aznavrail-updates-play; do
            dest="$publish_dir/com/github/HereLiesAz/AzNavRail/$module/$UPDATE_VERSION"
            if test -d "$dest"; then
              test -s "$dest/$module-$UPDATE_VERSION.aar"
              test -s "$dest/$module-$UPDATE_VERSION.pom"
              continue
            fi
            mkdir -p "$dest"
            cp -a "$source_dir/$module/$UPDATE_VERSION/." "$dest/"
          done
          git -C "$publish_dir" add com
          if ! git -C "$publish_dir" diff --cached --quiet; then
            git -C "$publish_dir" commit -m "Publish Android update libraries $UPDATE_VERSION"
            git -C "$publish_dir" push origin HEAD:refs/heads/update-maven
          fi

  # Share the publication workflow (not just its concurrency group): GitHub Actions
  # cancels an older pending run when a third run joins a group, even with
  # cancel-in-progress disabled. Finish the update writers before the review writer.
  publish-review:
    needs: [resolve, publish]
    if: ${{ always() && needs.resolve.result == 'success' && needs.resolve.outputs.versions != '[]' }}
    strategy:
      max-parallel: 1
      matrix:
        version: ${{ fromJSON(needs.resolve.outputs.versions) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.version }}
      - name: Check whether this revision contains the module
        id: module
        shell: bash
        run: |
          if [[ -f aznavrail-reviews-play/build.gradle.kts ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.module.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.module.outputs.present == 'true'
        with:
          gradle-version: '8.9'
      - name: Build, test and publish locally
        if: steps.module.outputs.present == 'true'
        env:
          REVIEW_VERSION: ${{ matrix.version }}
        run: |
          gradle -p aznavrail-reviews-play testDebugUnitTest publishReleasePublicationToMavenLocal -PreviewVersion="$REVIEW_VERSION" -Dmaven.repo.local="$RUNNER_TEMP/review-maven" --no-daemon
      - name: Publish immutable Maven coordinates
        if: steps.module.outputs.present == 'true'
        env:
          REVIEW_VERSION: ${{ matrix.version }}
        shell: bash
        run: |
          set -euo pipefail
          module=aznavrail-reviews-play
          source_dir="$RUNNER_TEMP/review-maven/com/github/HereLiesAz/AzNavRail/$module/$REVIEW_VERSION"
          test -s "$source_dir/$module-$REVIEW_VERSION.aar"
          test -s "$source_dir/$module-$REVIEW_VERSION.pom"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin refs/heads/update-maven
          publish_dir="$RUNNER_TEMP/review-maven-branch"
          git worktree add --detach "$publish_dir" FETCH_HEAD
          dest="$publish_dir/com/github/HereLiesAz/AzNavRail/$module/$REVIEW_VERSION"
          if [[ -d "$dest" ]]; then
            test -s "$dest/$module-$REVIEW_VERSION.aar"
            test -s "$dest/$module-$REVIEW_VERSION.pom"
            exit 0
          fi
          mkdir -p "$dest"
          cp -a "$source_dir/." "$dest/"
          git -C "$publish_dir" add com
          git -C "$publish_dir" commit -m "Publish Play review library $REVIEW_VERSION"
          git -C "$publish_dir" push origin HEAD:refs/heads/update-maven
