name: Publish Android update libraries

on:
  push:
    branches: [main]
    paths:
      - 'aznavrail-updates/**'
      - 'aznavrail-updates-play/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/publish-android-updates.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-update-maven
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and publish the standalone artifacts
        env:
          JITPACK: 'true'
          JITPACK_VERSION: ${{ github.sha }}
        run: |
          chmod +x gradlew
          ./gradlew :aznavrail-updates:testReleaseUnitTest :aznavrail-updates:publishReleasePublicationToMavenLocal :aznavrail-updates-play:publishReleasePublicationToMavenLocal -Dmaven.repo.local="$RUNNER_TEMP/update-maven" --no-daemon
      - name: Publish immutable Maven coordinates
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/update-maven/com/github/HereLiesAz/AzNavRail"
          publish_dir="$RUNNER_TEMP/update-maven-branch"
          for module in aznavrail-updates aznavrail-updates-play; do
            test -s "$source_dir/$module/$GITHUB_SHA/$module-$GITHUB_SHA.aar"
            test -s "$source_dir/$module/$GITHUB_SHA/$module-$GITHUB_SHA.pom"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin refs/heads/update-maven; then
            git fetch origin refs/heads/update-maven
            git worktree add --detach "$publish_dir" FETCH_HEAD
          else
            status=$?
            test "$status" = 2
            git worktree add --detach "$publish_dir" HEAD
            git -C "$publish_dir" checkout --orphan update-maven-bootstrap
            git -C "$publish_dir" rm -rf .
          fi
          for module in aznavrail-updates aznavrail-updates-play; do
            dest="$publish_dir/com/github/HereLiesAz/AzNavRail/$module/$GITHUB_SHA"
            if test -d "$dest"; then
              test -s "$dest/$module-$GITHUB_SHA.aar"
              test -s "$dest/$module-$GITHUB_SHA.pom"
              continue
            fi
            mkdir -p "$dest"
            cp -a "$source_dir/$module/$GITHUB_SHA/." "$dest/"
          done
          git -C "$publish_dir" add com
          if ! git -C "$publish_dir" diff --cached --quiet; then
            git -C "$publish_dir" commit -m "Publish Android update libraries $GITHUB_SHA"
            git -C "$publish_dir" push origin HEAD:refs/heads/update-maven
          fi
