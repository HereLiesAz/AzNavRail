name: Build AzNavRail vendor artifact

on:
  push:
    branches:
      - chatgpt/vendor-artifact

permissions:
  contents: read

jobs:
  build-vendor-artifact:
    runs-on: ubuntu-latest
    env:
      JITPACK_VERSION: d116cfa
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish Android library to local Maven
        run: |
          chmod +x gradlew
          ./gradlew :aznavrail:publishReleasePublicationToMavenLocal

      - name: Stage exact Maven module
        run: |
          SRC="$HOME/.m2/repository/com/github/HereLiesAz/AzNavRail/aznavrail/d116cfa"
          test -f "$SRC/aznavrail-d116cfa.aar"
          test -f "$SRC/aznavrail-d116cfa.pom"
          mkdir -p vendor-maven/com/github/HereLiesAz/AzNavRail/aznavrail/d116cfa
          cp "$SRC"/aznavrail-d116cfa.* vendor-maven/com/github/HereLiesAz/AzNavRail/aznavrail/d116cfa/
          find vendor-maven -type f -print

      - name: Upload local Maven module
        uses: actions/upload-artifact@v7
        with:
          name: aznavrail-d116cfa-vendor-maven
          path: vendor-maven
          if-no-files-found: error
