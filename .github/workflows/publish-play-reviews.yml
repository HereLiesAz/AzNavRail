name: Verify Play review library

on:
  pull_request:
    paths:
      - 'aznavrail-reviews-play/**'
      - '.github/workflows/publish-play-reviews.yml'
      - '.github/workflows/publish-android-updates.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-review-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build, test and publish locally
        run: |
          gradle -p aznavrail-reviews-play testDebugUnitTest publishReleasePublicationToMavenLocal -PreviewVersion="$GITHUB_SHA" -Dmaven.repo.local="$RUNNER_TEMP/review-maven" --no-daemon
