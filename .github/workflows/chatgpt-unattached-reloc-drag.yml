name: Apply unattached reloc drag fix

on:
  push:
    branches:
      - chatgpt/unattached-reloc-drag

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/unattached-reloc-drag
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/apply_unattached_reloc_fix.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Focused Android regression tests
        run: |
          chmod +x gradlew
          ./gradlew :aznavrail:testDebugUnitTest --tests com.hereliesaz.aznavrail.internal.AzUnattachedRelocItemClickTest

      - name: Build Android sample
        run: ./gradlew :SampleApp:assembleDebug

      - name: Compile Compose Multiplatform ports
        run: |
          ./gradlew :aznavrail-cmp:compileCommonMainKotlinMetadata :aznavrail-cmp:compileDebugKotlinAndroid :aznavrail-cmp:desktopMainClasses :aznavrail-cmp:compileKotlinWasmJs

      - name: Commit tested fix
        run: |
          rm .github/workflows/chatgpt-unattached-reloc-drag.yml
          rm .github/scripts/apply_unattached_reloc_fix.py
          git config user.name ChatGPT
          git config user.email 103241502+HereLiesAz@users.noreply.github.com
          git add -A
          git commit -m "Enable reloc drag-reorder under unattached hosts [skip ci]"
          git push origin HEAD:chatgpt/unattached-reloc-drag
