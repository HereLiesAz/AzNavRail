name: Stage Graffux Maven dependency

on:
  push:
    branches:
      - graffux-vendor-maven

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    env:
      JITPACK_VERSION: d116cfa
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: graffux-vendor-maven
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Maven publication
        run: |
          chmod +x gradlew
          ./gradlew :aznavrail:publishReleasePublicationToMavenLocal
          SRC="$HOME/.m2/repository/com/github/HereLiesAz/AzNavRail/aznavrail/d116cfa"
          DEST="maven/com/github/HereLiesAz/AzNavRail/aznavrail/d116cfa"
          mkdir -p "$DEST"
          cp "$SRC"/aznavrail-d116cfa* "$DEST"/
          test -f "$DEST/aznavrail-d116cfa.aar"
          test -f "$DEST/aznavrail-d116cfa.pom"
          test -f "$DEST/aznavrail-d116cfa.module"

      - name: Commit Maven module only
        run: |
          rm .github/workflows/chatgpt-stage-graffux-maven.yml
          git config user.name ChatGPT
          git config user.email 103241502+HereLiesAz@users.noreply.github.com
          git add maven .github/workflows/chatgpt-stage-graffux-maven.yml
          git commit -m "Stage AzNavRail for Graffux [skip ci]"
          git push origin HEAD:graffux-vendor-maven
