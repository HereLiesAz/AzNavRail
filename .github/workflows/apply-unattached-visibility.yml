name: Apply unattached overflow and visibility

on:
  push:
    branches:
      - feature/unattached-rail-scrolling
    paths:
      - '.github/scripts/apply_unattached_visibility.py'
      - '.github/workflows/apply-unattached-visibility.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unattached-rail-scrolling
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Apply source migration
        run: python .github/scripts/apply_unattached_visibility.py

      - name: Verify Android library tests
        run: ./gradlew :aznavrail:testDebugUnitTest

      - name: Verify Android sample
        run: ./gradlew :SampleApp:assembleDebug

      - name: Verify CMP common and platform targets
        run: ./gradlew :aznavrail-cmp:compileCommonMainKotlinMetadata :aznavrail-cmp:compileDebugKotlinAndroid :aznavrail-cmp:desktopMainClasses :aznavrail-cmp:compileKotlinWasmJs

      - name: Commit verified sources
        run: |
          git config user.name 'AzNavRail CI'
          git config user.email 'actions@users.noreply.github.com'
          git add aznavrail aznavrail-cmp docs
          git diff --cached --quiet && exit 0
          git commit -m 'Add scrollable unattached rails and reversible Az visibility'
          git push origin HEAD:feature/unattached-rail-scrolling
